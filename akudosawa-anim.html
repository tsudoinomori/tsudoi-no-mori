<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>安久登沢の河川争奪</title>
<style>
/* 平面図と縦断図を左に、段階の説明と再生操作を右に置く。狭い画面では操作を先頭にする。 */
:root{
  --bg:#FBF6EA; --panel:#ffffff; --ink:#2A2418; --muted:#5B4E3C; --line:#DFCFA0; --hover:#F2E9D3;
  --accent:#2C4B34; --accent-soft:#E4EEDD;
  --water:#2F72B8; --water-weak:#8DB4DC; --ridge:#7A4E22; --fan:#E2C27A; --terrace:#F5E7A8; --erode:#C1552B; --road:#2E8B4A;
  --font:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--font);padding:16px}
.wrap{max-width:1200px;margin:0 auto}
header{margin-bottom:12px}
h1{font-size:clamp(20px,3vw,26px);line-height:1.3;margin:0 0 2px}
.sub{margin:0;color:var(--muted);font-size:13.5px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.side{order:-1;min-width:0}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:960px){
  .layout{grid-template-columns:minmax(0,1fr) 300px;align-items:start}
  .side{order:2;position:sticky;top:16px}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.panel h2{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel h2 span{font-weight:400;letter-spacing:0}
svg{display:block;width:100%;height:auto}
#plan{border-radius:8px;overflow:hidden}

.stages{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:2px}
@media (max-width:959px){.stages{display:grid;grid-template-columns:1fr 1fr}}
.stages button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px}
.stages button:hover{background:var(--hover)}
.stages button[aria-current="step"]{color:var(--ink);background:var(--accent-soft);font-weight:700}
.stages button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stages .n{font:500 12px/1 var(--mono);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor}
#stageTitle{font-size:16px;font-weight:700;margin:0 0 4px}
#desc{margin:0 0 14px;font-size:14px;min-height:8.5em}
@media (max-width:959px){#desc{min-height:0}}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:500 14px var(--font);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;min-width:6.5em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:4px solid;vertical-align:middle;margin-right:5px;border-radius:2px}
.legend i.old{border-top:3px dashed var(--water)}
.legend i.rg{border-top:3px dotted var(--ridge)}
.legend i.fn{height:10px;border:none;background:var(--fan);width:18px}
.legend i.tr{height:10px;border:none;background:var(--terrace);width:18px;outline:1px solid #d9c46a}
.note{margin:12px 0 0;font-size:12px;color:var(--muted);line-height:1.7}

.flow{fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:1.5 10;stroke-linecap:round;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11.5}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
.lbl{font:700 22px var(--font);fill:#1b1410;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.lbl.sm{font-size:18px;font-weight:500}
.lbl.pt{fill:var(--erode)}
.badge{font:700 20px var(--font)}
.t{font:500 11.5px var(--mono);fill:var(--muted)}
.tl{font:700 12.5px var(--font);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.tl.sm{font-size:11.5px;font-weight:500}
.tl.pt{fill:var(--erode)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>安久登沢の河川争奪</h1>
    <p class="sub">古安久登沢が南本内川に奪われ、いまの地形になるまでを5つの段階で追う模式アニメーション</p>
  </header>

  <div class="layout">
    <div class="main">
      <section class="panel" aria-label="平面図">
        <h2>平面図 <span>段彩陰影図に流路・尾根・土砂を重ねた模式図</span></h2>
        <svg id="plan" viewBox="120 250 900 760" role="img" aria-label="安久登沢、南本内川、小荒沢、水無沢の流路が段階ごとに変わる平面図">
          <image href="img/column/akudo-relief.jpg" x="0" y="0" width="1125" height="1112"/>
          <rect x="0" y="0" width="1125" height="1112" fill="#fff" opacity=".28"/>
          <path id="terrace" fill="none" stroke="var(--terrace)" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
          <path id="fan" fill="var(--fan)" stroke="#b8913d" stroke-width="2" opacity="0"/>
          <g id="ridgeG" fill="none" stroke="var(--ridge)" stroke-width="7" stroke-dasharray="2 10" stroke-linecap="round">
            <path id="ridgeTip" d="M404 630 426 668"/>
            <path d="M426 668 448 690 470 740 495 800 500 870 495 940"/>
          </g>
          <g id="erodeG" opacity="0" stroke="var(--erode)" stroke-width="4" stroke-linecap="round" fill="none">
            <path d="M396 626 408 636M400 646 412 654M404 666 416 672"/>
          </g>
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path id="mizunashi" stroke="var(--water)" stroke-width="4"/>
            <path id="minami" stroke="var(--water)" stroke-width="7"/>
            <path id="akudo" stroke="var(--water)" stroke-width="6"/>
            <path id="link" d="M420 670 430 632" stroke="var(--water)" stroke-width="6"/>
            <path id="linkOld" d="M420 670 430 632" stroke="var(--water)" stroke-width="4" stroke-dasharray="8 7" opacity="0"/>
            <path id="koara" stroke="var(--water)" stroke-width="6"/>
            <path class="flow" id="fMizu"/>
            <path class="flow" id="fMinami"/>
            <path class="flow" id="fAkudo"/>
            <path class="flow" id="fLink" d="M420 670 430 632"/>
            <path class="flow" id="fKoara"/>
          </g>
          <g id="fallG" opacity="0">
            <circle cx="420" cy="662" r="20" fill="none" stroke="#fff" stroke-width="4"/>
            <text class="lbl sm" x="392" y="712" text-anchor="end">滝になって落ちる</text>
          </g>
          <g id="knickG" opacity="0">
            <path id="knick" d="M-12 0H12" stroke="var(--erode)" stroke-width="6" stroke-linecap="round"/>
            <text id="knickT" class="lbl sm" fill="var(--erode)">遷急点</text>
          </g>
          <g id="roadG" opacity="0">
            <text class="lbl sm" x="680" y="350" transform="rotate(-17 680 350)">秋田自動車道</text>
          </g>
          <text class="lbl" x="250" y="960" transform="rotate(-50 250 960)">南本内川</text>
          <text class="lbl" x="575" y="1000">安久登沢</text>
          <text class="lbl" x="560" y="470" transform="rotate(-42 560 470)">小荒沢</text>
          <text class="lbl sm" x="120" y="800">水無沢</text>
          <text class="lbl sm" x="830" y="285">錦秋湖</text>
          <g>
            <circle cx="535" cy="923" r="8" fill="var(--erode)" stroke="#fff" stroke-width="2"/><text class="lbl pt" x="512" y="930" text-anchor="end">A</text>
            <circle cx="538" cy="817" r="8" fill="var(--erode)" stroke="#fff" stroke-width="2"/><text class="lbl pt" x="515" y="824" text-anchor="end">B</text>
            <circle cx="420" cy="670" r="9" fill="var(--erode)" stroke="#fff" stroke-width="2"/><text class="lbl pt" x="438" y="696">C</text>
            <circle cx="430" cy="632" r="8" fill="var(--erode)" stroke="#fff" stroke-width="2"/><text class="lbl pt" x="448" y="626">D</text>
          </g>
          <g transform="translate(140 270)">
            <rect width="220" height="44" rx="10" fill="#fff" opacity=".9"/>
            <text id="upT" class="badge" x="14" y="30" fill="var(--accent)">土地：隆起中 ↑</text>
          </g>
        </svg>
      </section>

      <section class="panel" aria-label="縦断図">
        <h2>縦断図 <span>流路にそった距離と標高（元図からの読み取り値）</span></h2>
        <svg id="sec" viewBox="0 0 600 300" role="img" aria-label="安久登沢、小荒沢、南本内川の縦断図。争奪のあと遷急点が上流へさかのぼる">
          <g stroke="var(--line)" stroke-width="1" id="grid"></g>
          <g id="axes"></g>
          <path id="sMinami" fill="none" stroke="var(--water-weak)" stroke-width="2.5"/>
          <path id="sKoaraFill" fill="#7FAE64" opacity=".18"/>
          <path id="sAkudoFill" fill="#E7A83A" opacity=".2"/>
          <path id="sGhost" fill="none" stroke="var(--water)" stroke-width="2" stroke-dasharray="6 5" opacity="0"/>
          <path id="sLink" fill="none" stroke="var(--water)" stroke-width="3.5"/>
          <path id="sKoara" fill="none" stroke="var(--water)" stroke-width="3.5"/>
          <path id="sAkudo" fill="none" stroke="var(--water)" stroke-width="3.5" stroke-linejoin="round"/>
          <g id="sKnickG" opacity="0">
            <circle id="sKnick" r="6" fill="none" stroke="var(--erode)" stroke-width="2.5"/>
            <text id="sKnickT" class="tl sm" fill="var(--erode)" text-anchor="end">遷急点</text>
          </g>
          <g id="sPts"></g>
          <text class="tl sm" x="110" y="214" fill="var(--water)">南本内川</text>
          <text class="tl" x="450" y="194">小荒沢</text>
          <text class="tl" x="120" y="170">安久登沢</text>
        </svg>
      </section>
    </div>

    <aside class="side">
      <section class="panel">
        <ol class="stages" id="stages"></ol>
        <p id="stageTitle"></p>
        <p id="desc"></p>
        <div class="ctrl">
          <button class="btn" id="prev" aria-label="前の段階">◀</button>
          <button class="btn primary" id="play">▶ 再生</button>
          <button class="btn" id="next" aria-label="次の段階">▶</button>
        </div>
        <ul class="legend">
          <li><i style="border-color:var(--water)"></i>いまの流れ</li>
          <li><i class="old"></i>かつての流れ</li>
          <li><i class="rg"></i>尾根</li>
          <li><i class="fn"></i>水無沢の土砂</li>
          <li><i class="tr"></i>河岸段丘</li>
        </ul>
        <p class="note">流路の位置や移り変わりは、地形から推定した模式です。背景は段彩陰影図。</p>
      </section>
    </aside>
  </div>
</div>

<script>
(function(){
  /* ---------- 段階ごとの説明と状態 ---------- */
  var STAGES = [
    {t:'争奪の前', d:'古安久登沢はC点で止まらずに北へ進み、D点を抜けて、いまの小荒沢の谷を流れていました。上流の水をすべて集めて、広い谷を削っていきます。南本内川はまだ西寄りを流れ、あいだには尾根があります。',
     shift:1, fan:.25, terr:0, cap:0, p:0, fall:0, ero:0, up:1, road:0},
    {t:'水無沢の土砂に押される', d:'西の水無沢が、第三紀花こう岩の山から大量の土砂を運び込みます。南本内川は谷の東側へ押しやられ、安久登沢とのあいだの尾根のすそを削りはじめます。',
     shift:-.25, fan:1, terr:0, cap:0, p:0, fall:0, ero:1, up:1, road:0},
    {t:'尾根が崩れて、争奪', d:'尾根の一部が崩れ、安久登沢の水は約70m低い南本内川へ、滝になってなだれ込みます。D点から先の小荒沢は、上流の水を失いました。',
     shift:-.25, fan:1, terr:0, cap:1, p:.05, fall:1, ero:0, up:1, road:0},
    {t:'隆起が休み、段丘ができる', d:'土地の盛り上がりが止まり、南本内川は横に広がって河岸段丘をつくります。東の急な斜面から崩れた土砂に押され、流れは再び西へ。安久登沢では、急な区間（遷急点）が上流へさかのぼっていきます。',
     shift:.5, fan:.7, terr:1, cap:1, p:.5, fall:0, ero:0, up:0, road:0},
    {t:'ふたたび隆起して、いまの姿', d:'土地がまた盛り上がり、南本内川は両岸を削り込んで、いまの位置に固定されます。遷急点はB点まで達しました。水を失った小荒沢の広くおだやかな谷には、高速道路が通っています。',
     shift:0, fan:.6, terr:.8, cap:1, p:1, fall:0, ero:0, up:1, road:1}
  ];

  /* ---------- 平面図の形 ---------- */
  var MINAMI = [[187,1100],[202,1060],[240,1000],[277,940],[298,905],[334,865],[345,820],[370,790],[395,768],[409,740],[413,705],[419,680],[397,660],[378,635],[360,600],[356,565],[345,540],[312,515],[308,485],[302,460],[283,440],[262,405],[240,375],[210,350],[160,320]];
  var SHIFTW = [0,0,0,0,0,0,5,15,30,42,50,55,55,50,40,28,15,5,0,0,0,0,0,0,0];
  var AKUDO = [[600,1110],[563,1050],[545,1010],[528,960],[535,923],[544,880],[547,850],[538,817],[534,775],[524,745],[505,720],[480,695],[462,675],[440,668],[420,670]];
  var KOARA = [[430,632],[455,580],[490,520],[530,460],[570,414],[600,400],[630,391],[660,382],[690,373],[720,363],[750,354],[790,338],[820,322],[845,305],[862,290]];
  var MIZU = [[100,760],[160,733],[220,713],[280,689],[330,660]];

  function smooth(pts){
    var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (var i = 0; i < pts.length - 1; i++){
      var p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
      var c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
      var c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
      d += 'C' + c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
    }
    return d;
  }
  function minamiPts(shift){
    return MINAMI.map(function(p, i){ return [p[0] - SHIFTW[i]*shift, p[1]]; });
  }
  function fanPath(cx, cy, r){
    if (r < 1) return '';
    return 'M'+cx+' '+cy+'L'+(cx-r*1.3)+' '+(cy-r*.55)+'Q'+(cx-r*1.7)+' '+(cy+r*.3)+' '+(cx-r*1.1)+' '+(cy+r*.95)+'Z';
  }
  function along(pts, t){
    var L = [0], i;
    for (i = 1; i < pts.length; i++) L.push(L[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
    var s = t * L[L.length-1];
    for (i = 1; i < pts.length; i++){
      if (s <= L[i]){
        var f = (s - L[i-1]) / (L[i] - L[i-1] || 1);
        return [pts[i-1][0] + (pts[i][0]-pts[i-1][0])*f, pts[i-1][1] + (pts[i][1]-pts[i-1][1])*f];
      }
    }
    return pts[pts.length-1];
  }
  var C_TO_B = AKUDO.slice(7).reverse();

  /* ---------- 縦断図の形 ---------- */
  var CUR = [[0,432],[0.2,431],[0.3,422],[0.5,421],[0.6,412],[0.8,392],[1.0,381],[1.15,370],[1.4,346],[1.5,330],[1.7,302],[1.9,287],[2.15,268]];
  var MINAMI_S = [[0,282],[0.5,280],[1,277],[1.4,273],[1.6,262],[2,259],[2.5,256],[3,251],[4,248],[5,245]];
  var KOARA_S = [[2.35,337],[2.7,332],[3.0,325],[3.4,313],[3.9,305],[4.15,282],[4.5,258],[4.7,247],[5,245]];
  function X(k){ return 50 + 105*k; }
  function Y(m){ return 270 - (m-230)*1.05; }
  function lerpPts(pts, x){
    for (var i = 1; i < pts.length; i++){
      if (x <= pts[i][0]){
        var f = (x - pts[i-1][0]) / (pts[i][0] - pts[i-1][0]);
        return pts[i-1][1] + (pts[i][1]-pts[i-1][1])*f;
      }
    }
    return pts[pts.length-1][1];
  }
  function zOld(x){ return 392 - (x-0.8)*(55/1.55); }
  function zCur(x){ return lerpPts(CUR, x); }
  var XS = [];
  for (var x = 0; x <= 2.1501; x += 0.0125) XS.push(Math.min(x, 2.15));
  // 争奪前は A点から先が古い勾配、争奪後は遷急点 k より下流がいまの谷底
  function profile(stage){
    return XS.map(function(x){
      if (stage <= 1) return x <= 0.8 ? zCur(x) : zOld(x);
      if (stage === 4) return zCur(x);
      var k = stage === 2 ? 2.08 : 1.8;
      if (x >= k) return zCur(x);
      return x <= 0.8 ? zCur(x) : zOld(x);
    });
  }
  var PROFILES = STAGES.map(function(_, i){ return profile(i); });
  function line(pts){ return pts.map(function(p, i){ return (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); }).join(''); }

  // 目盛り
  var grid = document.getElementById('grid'), axes = document.getElementById('axes'), svgNS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent, text){
    var e = document.createElementNS(svgNS, tag);
    for (var a in attrs) e.setAttribute(a, attrs[a]);
    if (text) e.textContent = text;
    parent.appendChild(e); return e;
  }
  [250,300,350,400,450].forEach(function(m){
    el('path', {d:'M50 '+Y(m)+'H575'}, grid);
    el('text', {x:44, y:Y(m)+4, 'text-anchor':'end', class:'t'}, axes, m === 450 ? '450m' : String(m));
  });
  el('path', {d:'M50 '+Y(230)+'H575', stroke:'var(--muted)', 'stroke-width':1}, axes);
  [0,1,2,3,4,5].forEach(function(k){
    el('text', {x:X(k), y:290, 'text-anchor':'middle', class:'t'}, axes, k === 5 ? '5km' : String(k));
  });
  document.getElementById('sMinami').setAttribute('d', line(MINAMI_S));
  document.getElementById('sKoara').setAttribute('d', line(KOARA_S));
  document.getElementById('sKoaraFill').setAttribute('d', line(KOARA_S) + 'L' + X(5) + ' ' + Y(230) + 'L' + X(2.35) + ' ' + Y(230) + 'Z');
  document.getElementById('sGhost').setAttribute('d', 'M'+X(0.8)+' '+Y(392)+'L'+X(2.35)+' '+Y(337));
  var sPts = document.getElementById('sPts');
  [['A',0.8,392,-8,-10],['B',1.4,346,10,-6,'sB'],['C',2.15,268,10,16],['D',2.35,337,8,-10]].forEach(function(p){
    var gp = el('g', p[5] ? {id:p[5]} : {}, sPts);
    el('circle', {cx:X(p[1]), cy:Y(p[2]), r:5, fill:'var(--erode)'}, gp);
    el('text', {x:X(p[1])+p[3], y:Y(p[2])+p[4], class:'tl pt', 'text-anchor': p[3] < 0 ? 'end' : 'start'}, gp, p[0]);
  });

  /* ---------- 描画 ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var state = Object.assign({}, STAGES[0]);
  var prof = PROFILES[0].slice();

  function draw(){
    var s = state;
    var mp = minamiPts(s.shift);
    var mD = smooth(mp);
    $('minami').setAttribute('d', mD); $('fMinami').setAttribute('d', mD);
    $('terrace').setAttribute('d', smooth(mp.slice(5, 21))); $('terrace').setAttribute('opacity', (.6*s.terr).toFixed(2));
    var j = mp[13];
    var mz = MIZU.slice(0, -1).concat([[j[0]-10, j[1]+6]]);
    $('mizunashi').setAttribute('d', smooth(mz)); $('fMizu').setAttribute('d', smooth(mz));
    $('fan').setAttribute('d', fanPath(j[0]-12, j[1]+8, 60*s.fan)); $('fan').setAttribute('opacity', (.85*Math.min(1, s.fan*1.4)).toFixed(2));
    var aD = smooth(AKUDO);
    $('akudo').setAttribute('d', aD); $('fAkudo').setAttribute('d', aD);
    $('koara').setAttribute('d', smooth(KOARA)); $('fKoara').setAttribute('d', smooth(KOARA));
    $('koara').setAttribute('stroke-width', (6 - 3.5*s.cap).toFixed(2));
    $('fKoara').setAttribute('opacity', (1 - .7*s.cap).toFixed(2));
    $('link').setAttribute('opacity', (1 - s.cap).toFixed(2));
    $('fLink').setAttribute('opacity', (1 - s.cap).toFixed(2));
    $('linkOld').setAttribute('opacity', s.cap.toFixed(2));
    $('ridgeTip').setAttribute('opacity', (1 - s.cap).toFixed(2));
    $('erodeG').setAttribute('opacity', s.ero.toFixed(2));
    $('fallG').setAttribute('opacity', s.fall.toFixed(2));
    $('roadG').setAttribute('opacity', s.road.toFixed(2));
    var kp = along(C_TO_B, s.p);
    $('knick').setAttribute('transform', 'translate(' + kp[0].toFixed(1) + ' ' + kp[1].toFixed(1) + ') rotate(-20)');
    $('knickT').setAttribute('x', (kp[0] + 22).toFixed(1)); $('knickT').setAttribute('y', (kp[1] + 6).toFixed(1));
    $('knickG').setAttribute('opacity', s.cap.toFixed(2));
    $('upT').textContent = s.up > .5 ? '土地：隆起中 ↑' : '土地：隆起が休止';

    // 縦断図
    var pts = XS.map(function(x, i){ return [x, prof[i]]; });
    $('sAkudo').setAttribute('d', line(pts));
    $('sAkudoFill').setAttribute('d', line(pts) + 'L' + X(2.15) + ' ' + Y(230) + 'L' + X(0) + ' ' + Y(230) + 'Z');
    $('sLink').setAttribute('d', 'M' + X(2.15) + ' ' + Y(prof[prof.length-1]) + 'L' + X(2.35) + ' ' + Y(337));
    $('sLink').setAttribute('opacity', (1 - s.cap).toFixed(2));
    $('sKoara').setAttribute('stroke-width', (3.5 - 1.8*s.cap).toFixed(2));
    $('sGhost').setAttribute('opacity', s.cap.toFixed(2));
    var kx = 2.15 - .75*s.p;
    $('sKnick').setAttribute('cx', X(kx)); $('sKnick').setAttribute('cy', Y(zCur(kx)));
    $('sKnickT').setAttribute('x', X(kx) - 10); $('sKnickT').setAttribute('y', Y(zCur(kx)) - 8);
    $('sKnickG').setAttribute('opacity', s.cap.toFixed(2));
    $('sB').setAttribute('opacity', s.p.toFixed(2));
  }

  /* ---------- 段階の切りかえ ---------- */
  var KEYS = ['shift','fan','terr','cap','p','fall','ero','up','road'];
  var cur = 0, anim = null, timer = null, playing = false;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function go(n){
    cur = (n + STAGES.length) % STAGES.length;
    var from = Object.assign({}, state), fromP = prof.slice();
    var to = STAGES[cur], toP = PROFILES[cur];
    var t0 = performance.now(), dur = reduce ? 0 : 1400;
    if (anim) cancelAnimationFrame(anim);
    (function step(now){
      var f = dur ? Math.min(1, (now - t0) / dur) : 1;
      var e = f < .5 ? 2*f*f : 1 - Math.pow(-2*f + 2, 2)/2;
      KEYS.forEach(function(k){ state[k] = from[k] + (to[k] - from[k]) * e; });
      prof = fromP.map(function(z, i){ return z + (toP[i] - z) * e; });
      draw();
      if (f < 1) anim = requestAnimationFrame(step);
    })(t0);
    $('stageTitle').textContent = (cur + 1) + '. ' + to.t;
    $('desc').textContent = to.d;
    document.querySelectorAll('#stages button').forEach(function(b, i){
      if (i === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
  }
  function setPlaying(on){
    playing = on;
    $('play').textContent = on ? '❚❚ 一時停止' : '▶ 再生';
    clearInterval(timer);
    if (on) timer = setInterval(function(){
      if (cur === STAGES.length - 1) { setPlaying(false); return; }
      go(cur + 1);
    }, 5200);
  }

  var list = $('stages');
  STAGES.forEach(function(s, i){
    var li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = '<span class="n">' + (i + 1) + '</span>' + s.t;
    b.addEventListener('click', function(){ setPlaying(false); go(i); });
    li.appendChild(b); list.appendChild(li);
  });
  $('prev').addEventListener('click', function(){ setPlaying(false); go(cur - 1); });
  $('next').addEventListener('click', function(){ setPlaying(false); go(cur + 1); });
  $('play').addEventListener('click', function(){
    if (playing) { setPlaying(false); return; }
    if (cur === STAGES.length - 1) go(0);
    setPlaying(true);
  });

  draw();
  go(0);
})();
</script>
</body>
</html>
